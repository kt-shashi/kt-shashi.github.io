<section id="about" class="section-shell content-section about" aria-labelledby="about-title">
  <div class="section-heading">
    <h1 id="about-title">A little more about Shashi.</h1>
  </div>
  <div class="hobby-grid">
    @for (hobby of hobbies; track hobby.name) {
    <article class="hobby-card depth-card">
      <img [src]="hobby.image" alt="" draggable="false" data-cursor-exclude />
      <div class="hobby-body">
        <h2>{{ hobby.name }}</h2>
        <p>{{ hobby.detail }}</p>
      </div>
    </article>
    }
  </div>
</section>
