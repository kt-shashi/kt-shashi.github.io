<section id="education" class="section-shell content-section" aria-labelledby="education-title">
  <div class="section-heading">
    <div>
      <span class="eyebrow">05 / ACADEMIC JOURNEY</span>
      <h1 id="education-title">Education</h1>
    </div>
  </div>
  <ol class="timeline" role="list">
    @for (entry of qualifications; track entry.institution) {
      <li>
        <div class="period">
          <span class="dates">{{ entry.dates }}</span>
          <span class="city">{{ entry.city }}</span>
        </div>
        <div class="school">
          <h2>{{ entry.qualification }}</h2>
          <p>{{ entry.institution }}</p>
        </div>
        <span class="result">{{ entry.result }}</span>
      </li>
    }
  </ol>
</section>
